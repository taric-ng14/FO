<style>
:root{--bg:#ffffff;--panel:#fff;--ink:#1f2a17;--muted:#5f6b55;--line:#d6dccb;--green:#556B2F;--brass:#556B2F;--brass-bg:#edf1e3;--good:#3c7d2a;--warn:#b3402f;--on-green:#ffffff;

*{box-sizing:border-box}

.card{border-top:3px solid var(--green)}

.board{grid-template-columns:repeat(5,1fr);max-height:none;overflow:visible;margin-top:0}
.flr{display:grid;grid-template-columns:34px 1fr;gap:6px;align-items:center;margin-top:6px}.flr>span{font-weight:700;color:var(--green);font-size:12px}
.lg{display:flex;flex-wrap:wrap;gap:6px;margin:8px 0}.fl{border:1px solid var(--line);background:var(--panel);color:var(--ink);padding:4px 10px;border-radius:3px;font-size:12px}.fl.on{background:var(--green);color:#fff;border-color:var(--green)}
.rm i{font-style:normal;font-size:11px;color:var(--brass)}aside li.dn{text-decoration:none;color:var(--good)}

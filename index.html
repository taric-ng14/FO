<!DOCTYPE html>
<html lang="vi">
<head>

<title>FRONTDESK VN - Rosemary Luxury Boutique Hotel</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#ffffff;--panel:#fff;--ink:#1f2a17;--muted:#5f6b55;--line:#d6dccb;--green:#556B2F;--brass:#556B2F;--brass-bg:#edf1e3;--good:#3c7d2a;--warn:#b3402f;--on-green:#ffffff;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#12160d;--panel:#1b2113;--ink:#eef2e4;--muted:#aab59a;--line:#333d25;--green:#556B2F;--brass:#a3c26b;--brass-bg:#2a331b;--good:#7ccf5f;--warn:#ee7d6b}}
:root[data-theme="dark"]{--bg:#12160d;--panel:#1b2113;--ink:#eef2e4;--muted:#aab59a;--line:#333d25;--green:#556B2F;--brass:#a3c26b;--brass-bg:#2a331b;--good:#7ccf5f;--warn:#ee7d6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1,h2{font-weight:700;margin:0}
header.top{background:var(--green);color:var(--on-green);border-radius:3px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
header.top b{font-size:18px}
header.top small{opacity:.8;display:block}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:right;min-width:64px}
.stat span{display:block;font-size:12px;opacity:.75}
.stat strong{font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:3px;padding:18px;margin-top:14px}
.patience{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.patience i{display:block;height:100%;width:100%;background:var(--good);transition:width .25s linear,background .3s}
.guest{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:none;width:52px;height:52px;border-radius:3px;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:24px}
.say{background:var(--brass-bg);border-radius:4px 12px 12px 12px;padding:12px 14px;margin:0}
.name{font-weight:700}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.doc{border:1px solid var(--line);border-top:2px solid var(--green);border-radius:0;padding:10px 12px;font-size:14px;background:var(--panel)}
.doc h3{margin:0 0 4px;font-size:13px;color:var(--brass);font-weight:700}
.doc div{display:flex;justify-content:space-between;gap:8px}
.doc div span:first-child{color:var(--muted)}
.pms{font-size:14px;color:var(--muted);margin:14px 0 0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:3px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brass);background:var(--brass-bg)}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked{opacity:1;border-color:var(--ink)}
.fb{margin-top:16px;border-left:5px solid var(--muted);padding:10px 14px;background:var(--bg);border-radius:0 8px 8px 0}
.fb.q2{border-color:var(--good)}.fb.q1{border-color:var(--brass)}.fb.q0{border-color:var(--warn)}
.fb b{display:block}
.delta{font-size:13px;color:var(--muted);margin-top:4px}
.btn{background:var(--green);color:var(--on-green);border:0;border-radius:3px;padding:12px 22px;font-weight:700;margin-top:14px}
.btn:hover{filter:brightness(1.15)}
.center{text-align:center}
.stars{font-size:34px;color:var(--brass);letter-spacing:4px}
ul.rev{text-align:left;padding-left:20px;margin:14px auto;max-width:560px}
.note{font-size:13px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.rm{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);color:var(--ink);text-align:left;font-size:12px;line-height:1.35}
.rm b{font-size:16px;display:block}
.rm.free{border-color:var(--good)}.rm.occ{background:var(--bg);color:var(--muted)}.rm.clean{border-style:dashed;border-color:var(--brass)}.rm.maint{border-color:var(--warn);border-style:dotted}
.rm:disabled{cursor:default}.rm.go:not(:disabled):hover{background:var(--brass-bg)}
.bill{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.bill td{padding:8px 4px;border-bottom:1px solid var(--line)}.bill td:last-child{text-align:right;white-space:nowrap}
.bill input{width:20px;height:20px;accent-color:var(--green)}
.tot{font-weight:700;font-size:18px;margin-top:10px}
.bill td:only-child{text-align:left}
.card{border-top:3px solid var(--green)}
.shell{display:grid;grid-template-columns:230px 1fr;gap:14px;margin-top:4px}.shell:has(aside:empty){grid-template-columns:1fr}
aside{font-size:12px;background:var(--panel);border:1px solid var(--line);border-top:3px solid var(--green);padding:10px;max-height:78vh;overflow:auto;position:sticky;top:8px;align-self:start}
aside:empty{display:none}aside ol{padding-left:20px;margin:6px 0}aside li.cur{font-weight:700;color:var(--green)}aside li.dn{color:var(--muted);text-decoration:line-through}
.board{max-height:230px;overflow:auto}
@media(max-width:800px){.shell{grid-template-columns:1fr}aside{order:2;position:static;max-height:none}.shell>div{order:1}}
.gb{background:var(--panel);border:2px solid var(--line);border-radius:6px;padding:8px 14px;color:var(--ink);cursor:pointer}.gb.on{border-color:var(--green);background:var(--brass-bg)}
.ic{display:inline-block;vertical-align:-4px;margin-right:4px}
.bob{animation:bob 3s ease-in-out infinite}@keyframes bob{50%{transform:translateY(-3px)}}
.eye{transform-box:fill-box;transform-origin:center;animation:blink 4s infinite}@keyframes blink{0%,94%,100%{transform:scaleY(1)}97%{transform:scaleY(.1)}}
.wave{transform-box:fill-box;transform-origin:20% 90%;animation:wave 2s ease-in-out infinite}@keyframes wave{50%{transform:rotate(-25deg)}}
@media(prefers-reduced-motion:reduce){.bob,.eye,.wave{animation:none!important}}
.rm:hover{background:var(--brass-bg)}.rm.res{border-color:#c99a1c;border-style:double;border-width:4px}
.mail{background:var(--bg);border:1px solid var(--line);padding:10px;white-space:pre-wrap;font-size:14px;margin-top:12px}
.bk{display:grid;grid-template-columns:repeat(auto-fit,minmax(120px,1fr));gap:6px;margin-top:10px;padding:8px;border:1px solid var(--line);border-left:4px solid var(--green)}.bk b{grid-column:1/-1}
.bk input,.bk select{padding:7px;border:1px solid var(--line);border-radius:3px;font:inherit;background:var(--panel);color:var(--ink)}
</style>
</head>

</header>
<section id="prog" style="margin-top:10px"></section><div class="shell"><aside id="side"></aside><div><section id="board"></section><section id="stage"></section></div></div>
</main>

 $("stage").innerHTML=`<div class="card center"><h2>FRONTDESK VN</h2><p>Bạn là nhân viên lễ tân của Grand Lotus Hotel. Mỗi khách đến quầy là một tình huống: xác minh giấy tờ, giữ bảo mật, xử lý khiếu nại. Chọn cách xử lý phù hợp nhất.</p><p class="note">Bản demo gồm 11 tình huống: nhận phòng, xếp phòng theo sơ đồ, trả phòng kiểm hóa đơn và night audit. Toàn bộ khách sạn, nhân vật và doanh nghiệp là giả định.</p><button class="btn" id="go">Bắt đầu ca làm</button></div>`;

 $("stage").innerHTML=`<div class="card"><div class="patience" role="progressbar" aria-label="Độ kiên nhẫn của khách"><i id="pat"></i></div>

 <div class="docs">${g.docs.map(d=>`<div class="doc"><h3>${d.t}</h3>${d.r.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`).join("")}</div>

  $("nx").onclick=()=>{if(more)chain(g,i+1,o[1]);else{S.i++;S.i>=G.length?end():show()}}})}
const CLIP='<svg viewBox="0 0 24 24" width="30" height="30"><rect x="5" y="4" width="14" height="18" rx="2" fill="#fff"/><rect x="9" y="2" width="6" height="4" rx="1" fill="#c99a1c"/><path d="M8 11h8M8 15h8" stroke="#556B2F" stroke-width="1.6"/></svg>';

function mkBk(){
 const rn=n=>Math.floor(Math.random()*n),en=rn(100)<20+rk()*12,src=rnd(["email","sales","web"]),tp=rnd(["Superior","Deluxe","Suite"]),n=1+rn(Math.min(5,2+rk())),nm=(en?EN:VN()).slice().sort(()=>Math.random()-.5),rooms=Array.from({length:n},(_,i)=>({name:nm[i],pax:1+rn(4),nights:1+rn(5),rq:rn(RQ.length)})),d=["02","03","04","05"][rn(4)]+"/10/2026",ref=1000+rn(9000),who=rnd(en?EN:VN());

 const H=(en?{email:`From: ${nz(who).replace(/ /g,".")}@mail.com\nSubject: Room reservation\nDear Reception,\nPlease book ${n} ${tp} room(s) from ${d}.\n`,sales:`[SALES NOTE] Corporate booking, ${n} ${tp} room(s), arrival ${d}\n`,web:`Website booking #W${ref} | ${n} ${tp} room(s) | Arrival ${d}\n`}:{email:`Từ: ${nz(who).replace(/ /g,".")}@mail.com\nChủ đề: Đặt phòng\nKính gửi Lễ tân,\nTôi muốn đặt ${n} phòng ${tp}, nhận phòng ngày ${d}.\n`,sales:`[SALES] Booking công ty, ${n} phòng ${tp}, nhận phòng ${d}\n`,web:`Đặt phòng website #W${ref} | ${n} phòng ${tp} | Nhận phòng ${d}\n`})[src];

function menu(){
 const sv=load();$("board").innerHTML="";$("prog").innerHTML="";$("shift").textContent="Khách sạn 5 sao giả định · Quầy lễ tân";
 $("stage").innerHTML=`<div class="card center"><h2>FRONTDESK VN</h2><p>Bạn làm lễ tân 30 ngày tại Rosemary Luxury Boutique Hotel, khách sạn 5 sao với 40 phòng thuộc 5 hạng (Superior, Deluxe, Executive, Suite, Presidential). Tiêu chuẩn 5 sao nghĩa là khách nhanh mất kiên nhẫn hơn. Mỗi ca có quy trình riêng: ca sáng nhận brief, làm folio, hướng dẫn khách ăn sáng, check-out và chuẩn bị Arrival List; ca chiều chuẩn bị welcome drink, kiểm tra phòng, set up VIP và check-in; ca đêm claim tiền OTA, night audit và chuẩn bị Departure List, Invoice, Breakfast List. Cuối mỗi ca đều phải bàn giao brief. Càng về sau khách càng đông, khách càng nóng tính và phòng trống càng ít. Tích lũy XP để thăng chức Trainee, Receptionist, Captain, FO Supervisor, AFOM, FOM. Chức càng cao càng khó, và quản lý bắt đầu giao việc từ Captain. Cuối ngày bạn nhận thưởng hoặc bị phạt. Hài lòng dưới 25 hoặc Uy tín dưới 20 vào cuối ngày là một cảnh cáo. Xử lý đúng giúp tăng Uy tín và giảm Stress, sai sót làm Stress tăng và trên 80 thì bạn kiệt sức, đủ 3 cảnh cáo thì mất việc.</p>
 ${gsel()}<p><label>Tên nhân viên: <input id="pn" maxlength="24" value="${esc(P.name)}" style="padding:8px;border:1px solid var(--line);border-radius:3px;font:inherit"></label></p><button class="btn" id="nw" style="margin:14px 6px 0">Chơi mới</button>${sv?`<button class="btn" id="ct" style="margin:14px 6px 0">Tiếp tục ngày ${sv.day}</button>`:""}<button class="btn" id="ac" style="margin:14px 6px 0">Thành tích</button>
 <p class="note">Toàn bộ khách sạn, nhân vật và doanh nghiệp là giả định. Tiến trình được lưu tự động trên trình duyệt này.</p></div>`;
 $("nw").onclick=()=>{P.name=$("pn").value.trim()||"Nhân viên mới";saveP();$("ac").onclick=null;Object.assign(S,{ts:[],gender:sel,rk:0,name:P.name,xp:0,clk:0,trust:50,stress:20,day:1,warn:0,sat:50,rev:0,ok:0,tot:0,hist:[],lastEv:""});hud();startDay()};
 $("ac").onclick=ach;document.querySelectorAll(".gb").forEach(b=>b.onclick=()=>{sel=b.dataset.g;P.gender=sel;saveP();document.querySelectorAll(".gb").forEach(x=>x.classList.toggle("on",x===b))});
 if(sv)$("ct").onclick=()=>{Object.assign(S,sv);if($("pn").value.trim()){S.name=$("pn").value.trim();P.name=S.name;saveP()}hud();startDay()};
}
function startDay(){
 S.hist=S.hist||[];const ban=S.hist.flat();
 S.ev=S.day%3==2?rnd(EVT.filter(e=>e.n!=S.lastEv)):null;if(S.ev)S.lastEv=S.ev.n;
 S.pm=S.ev?S.ev.pm:1;S.rk0=rk();resetRooms(S.ev?S.ev.occ:0);
 const pool=POOL.filter(g=>g.k!="audit"&&!ban.includes(g.id)&&(!g.mg||rk()>=2)).sort(()=>Math.random()-.5);
 const take=(f,n)=>{const r=[];for(let i=pool.length-1;i>=0&&r.length<n;i--)if(f(pool[i]))r.push(pool.splice(i,1)[0]);return r};
 const fill=(r,n)=>[...r,...take(g=>!g.k,n-r.length)].slice(0,n).sort(()=>Math.random()-.5),tc=(c,n)=>take(g=>g.cat==c,n);
 const gm=fill([...take(g=>g.k=="co",2),...tc("i",2)],5),ga=fill([...take(g=>g.k=="chain",rk()>=2?1:0),...take(g=>g.mg&&g.k!="chain",rk()>=2?2:0),...take(g=>g.k=="assign",3),...tc("w",2),...tc("i",1)],8),gn=fill([...tc("w",1),...tc("i",2)],5);
 S.hist.push([...gm,...ga,...gn].map(g=>g.id));S.hist=S.hist.slice(-3);
 const pr=g=>{const c={...g};if(c.o)c.o=c.o.slice().sort(()=>Math.random()-.5);if(c.k&&c.k!="chain")c.name=rnd(NAMES);return c};
 const tk=k=>({...TASKS[k],items:TASKS[k].items.slice().sort(()=>Math.random()-.5)});
 const ae=ga.map(pr);
 if(S.ev){const e={...S.ev.s};e.o=e.o.slice().sort(()=>Math.random()-.5);e.name="⚠️ "+e.name;ae.splice(Math.floor(Math.random()*(ae.length+1)),0,e)}
 const a=JSON.parse(JSON.stringify(POOL.find(g=>g.k=="audit"))),d=rnd([150000,300000,500000]);
 const t=x=>x.replace(/8\.150\.000đ|300\.000đ/g,m=>m[0]=="8"?fmt(8450000-d):fmt(d));
 a.say=t(a.say);a.o.forEach(o=>{o[0]=t(o[0]);o[4]=t(o[4])});a.o.sort(()=>Math.random()-.5);a.name="Night Audit - Cut-off";
 const sh=(ca,arr)=>arr.map(g=>({...g,shift:"Ngày "+S.day+" · "+ca}));
 const q=[...sh("Ca sáng",[bf("Nhận brief từ ca đêm","Departure List"),tk("folio"),tk("bfast"),mkBk(),...gm.map(pr),tk("arrlist"),tk("handM")]),
  ...sh("Ca chiều",[bf("Nhận Brief từ ca sáng","Arrival List"),tk("welcome"),tk("arrroom"),tk("vip"),...ae,tk("handA")]),
  ...sh("Ca đêm",[bf("Nhận Brief từ ca Chiều","Arrival còn lại"),mkBk(),...gn.map(pr),tk("ota"),a,tk("deplist"),tk("bflist"),tk("handN")])];
 const nt=q.filter(g=>g.k=="task").length;
 G.length=0;G.push(...q);S.i=0;S.log=[];S.d0={ok:S.ok,tot:S.tot};
 board(0);$("shift").textContent="Ngày "+S.day+"/30";
 $("stage").innerHTML=`<div class="card center"><h2>Ngày ${S.day}: ${LV(S.day)}</h2>${S.ev?`<div class="fb q1" style="text-align:left"><b>${S.ev.ic} Sự kiện đặc biệt: ${S.ev.n}</b>${S.ev.d}</div>`:""}<p>Hôm nay có ${q.length} lượt việc trong 3 ca: ${nt} bước quy trình ca và ${q.length-nt} lượt xử lý khách. Cảnh cáo hiện tại: ${S.warn}/3.</p><button class="btn" id="st">Bắt đầu ca sáng</button></div>`;

end=function(){
 const h=Math.max(1,S.tot-S.d0.tot),acc=(S.ok-S.d0.ok)/h,score=S.sat*.5+acc*50;
 const st=score>=85?5:score>=70?4:score>=55?3:score>=40?2:1;
 const bonus=st>=4?500000*(st-3):st<=2?-300000:0;S.rev+=0;S.rev+=bonus;
 const low=S.sat<25||S.trust<=20;if(low)S.warn++;
 const lost=S.warn>=3,win=!lost&&S.day>=30,bad=S.log.filter(l=>l.q<2).map(l=>l.n);

 $("stage").innerHTML=`<div class="card center"><h2>${lost?"Bạn bị cho thôi việc":win?"Hoàn thành 30 ngày!":"Kết thúc ngày "+S.day}</h2><div class="stars" aria-label="${st} trên 5 sao">${"★".repeat(st)}${"☆".repeat(5-st)}</div>
 ${elig?`<div class="fb q2" style="text-align:left"><b>Đủ XP thăng chức!</b>Bạn đủ điều kiện thi lên ${RANKS[S.rk+1][0]}.</div>`:""}<p>Xử lý <b>${h}</b> lượt · Chính xác ngày này <b>${Math.round(acc*100)}%</b> · Hài lòng <b>${S.sat}/100</b><br>${bonus?(bonus>0?"Thưởng ":"Phạt ")+fmt(Math.abs(bonus))+" · ":""}Tổng doanh thu <b>${fmt(S.rev)}</b></p>
 <p>Uy tín với quản lý <b>${S.trust}/100</b> · Stress <b>${S.stress}/100</b>${S.stress>=80?" (kiệt sức: hài lòng bị trừ 8 sang ngày sau)":""}</p>${bad.length?`<p>Cần xem lại: ${bad.join(", ")}.</p>`:"<p>Không có lỗi nào hôm nay.</p>"}
 ${low?`<p><b>Cảnh cáo ${S.warn}/3:</b> hài lòng dưới 25 hoặc uy tín quá thấp.</p>`:""}
 ${lost?"<p>Ba lần cảnh cáo. Khách sạn tìm người thay bạn.</p>":win?`<p>Kết quả cuối: doanh thu ${fmt(S.rev)}, chính xác ${Math.round(S.ok/S.tot*100)}%, ${S.warn} cảnh cáo.</p>`:""}
 <button class="btn" id="nd">${fin?"Xem bảng thành tích":elig?"Làm bài thi thăng chức":"Sang ngày "+(S.day+1)}</button></div>`;
 const adv=()=>{S.sat=Math.min(100,S.sat+8-(S.stress>=80?16:0));S.stress=Math.max(0,S.stress-(S.stress>=80?15:30));S.day++;hud();startDay()};$("nd").onclick=()=>fin?ach():elig?exam(S.rk+1,adv):adv();

<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>FRONTDESK VN - Game mô phỏng nghề lễ tân khách sạn (bản demo)</title>
<meta name="description" content="Vào vai lễ tân khách sạn: xác minh giấy tờ, xếp phòng, xử lý khiếu nại. Bản demo 6 tình huống. Mọi nhân vật và khách sạn đều là giả định.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;700&family=Playfair+Display:wght@700&display=swap" rel="stylesheet">
<style>
:root{--bg:#eef1ee;--panel:#fff;--ink:#14231f;--muted:#5b6b66;--line:#d3dbd7;--green:#0f3d3a;--brass:#a97c1f;--brass-bg:#f4e9cf;--good:#1e7a4d;--warn:#b3402f;--on-green:#f3f5f2;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0d1614;--panel:#152522;--ink:#e8eeeb;--muted:#9bb0aa;--line:#2b3f3a;--green:#0a2a28;--brass:#d6a94a;--brass-bg:#3a2f14;--good:#4cc98a;--warn:#ee7d6b}}
:root[data-theme="dark"]{--bg:#0d1614;--panel:#152522;--ink:#e8eeeb;--muted:#9bb0aa;--line:#2b3f3a;--green:#0a2a28;--brass:#d6a94a;--brass-bg:#3a2f14;--good:#4cc98a;--warn:#ee7d6b}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:400 16px/1.55 "Be Vietnam Pro",system-ui,sans-serif}
button{font:inherit;cursor:pointer}
:focus-visible{outline:3px solid var(--brass);outline-offset:2px}
.wrap{max-width:860px;margin:0 auto;padding:16px}
h1,h2{font-family:"Playfair Display",Georgia,serif;margin:0}
header.top{background:var(--green);color:var(--on-green);border-radius:12px;padding:14px 18px;display:flex;flex-wrap:wrap;gap:12px;justify-content:space-between;align-items:center}
header.top b{font-family:"Playfair Display",Georgia,serif;font-size:20px}
header.top small{opacity:.8;display:block}
.stats{display:flex;gap:16px;flex-wrap:wrap}
.stat{text-align:right;min-width:64px}
.stat span{display:block;font-size:12px;opacity:.75}
.stat strong{font-size:18px}
.card{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;margin-top:14px}
.patience{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin-bottom:6px}
.patience i{display:block;height:100%;width:100%;background:var(--good);transition:width .25s linear,background .3s}
.guest{display:flex;gap:14px;align-items:flex-start}
.avatar{flex:none;width:52px;height:52px;border-radius:50%;background:var(--green);color:var(--on-green);display:grid;place-items:center;font-size:24px}
.say{background:var(--brass-bg);border-radius:4px 12px 12px 12px;padding:12px 14px;margin:0}
.name{font-weight:700}
.docs{display:grid;grid-template-columns:repeat(auto-fit,minmax(230px,1fr));gap:12px;margin-top:14px}
.doc{border:1px dashed var(--brass);border-radius:6px;padding:10px 12px;font-size:14px;background:var(--panel)}
.doc h3{margin:0 0 4px;font-size:13px;color:var(--brass);font-weight:700}
.doc div{display:flex;justify-content:space-between;gap:8px}
.doc div span:first-child{color:var(--muted)}
.pms{font-size:14px;color:var(--muted);margin:14px 0 0}
.opts{display:grid;gap:10px;margin-top:16px}
.opt{text-align:left;background:var(--panel);color:var(--ink);border:1.5px solid var(--line);border-radius:10px;padding:12px 14px;transition:border-color .15s,background .15s}
.opt:hover:not(:disabled){border-color:var(--brass);background:var(--brass-bg)}
.opt:disabled{cursor:default;opacity:.55}
.opt.picked{opacity:1;border-color:var(--ink)}
.fb{margin-top:16px;border-left:5px solid var(--muted);padding:10px 14px;background:var(--bg);border-radius:0 8px 8px 0}
.fb.q2{border-color:var(--good)}.fb.q1{border-color:var(--brass)}.fb.q0{border-color:var(--warn)}
.fb b{display:block}
.delta{font-size:13px;color:var(--muted);margin-top:4px}
.btn{background:var(--green);color:var(--on-green);border:0;border-radius:10px;padding:12px 22px;font-weight:700;margin-top:14px}
.btn:hover{filter:brightness(1.15)}
.center{text-align:center}
.stars{font-size:34px;color:var(--brass);letter-spacing:4px}
ul.rev{text-align:left;padding-left:20px;margin:14px auto;max-width:560px}
.note{font-size:13px;color:var(--muted);margin-top:18px}
@media (prefers-reduced-motion:reduce){*{transition:none!important}}
.board{display:grid;grid-template-columns:repeat(auto-fill,minmax(84px,1fr));gap:8px;margin-top:10px}
.rm{border:2px solid var(--line);border-radius:8px;padding:6px 8px;background:var(--panel);color:var(--ink);text-align:left;font-size:12px;line-height:1.35}
.rm b{font-size:16px;display:block}
.rm.free{border-color:var(--good)}.rm.occ{background:var(--bg);color:var(--muted)}.rm.clean{border-style:dashed;border-color:var(--brass)}.rm.maint{border-color:var(--warn);border-style:dotted}
.rm:disabled{cursor:default}.rm.go:not(:disabled):hover{background:var(--brass-bg)}
.bill{width:100%;border-collapse:collapse;margin-top:12px;font-size:15px}
.bill td{padding:8px 4px;border-bottom:1px solid var(--line)}.bill td:last-child{text-align:right;white-space:nowrap}
.bill input{width:20px;height:20px;accent-color:var(--green)}
.tot{font-weight:700;font-size:18px;margin-top:10px}
.bill td:only-child{text-align:left}
</style>
</head>
<body>
<main class="wrap">
<header class="top">
  <div><b>Grand Lotus Hotel &amp; Spa ★★★★★</b><small id="shift">Khách sạn 5 sao giả định · Quầy lễ tân</small></div>
  <div class="stats" aria-live="polite">
    <div class="stat"><span>Hài lòng</span><strong id="sSat">50</strong></div>
    <div class="stat"><span>Doanh thu</span><strong id="sRev">0</strong></div>
    <div class="stat"><span>Chính xác</span><strong id="sAcc">100%</strong></div><div class="stat"><span>Uy tín</span><strong id="sTr">50</strong></div><div class="stat"><span>Stress</span><strong id="sSt">20</strong></div>
  </div>
</header>
<section id="prog" style="margin-top:10px"></section><section id="board"></section><section id="stage"></section>
</main>
<script>
const G=[
{av:"🧳",name:"Nguyễn Minh Anh",shift:"Ca sáng · 08:10",
 say:"Chào bạn, mình có đặt phòng ở đây 2 đêm. Cho mình nhận phòng nhé!",
 docs:[{t:"CCCD",r:[["Họ tên","NGUYỄN MINH ANH"],["Ngày sinh","12/03/1994"]]},{t:"Đặt phòng #HB2041",r:[["Tên","Nguyen Minh Anh"],["Phòng","Deluxe Double"],["Số đêm","2 (30/09 - 02/10)"]]}],
 pms:"Phòng 301 (Deluxe Double) đã dọn xong, sẵn sàng.",
 o:[["Đối chiếu CCCD với đặt phòng, xác nhận thông tin, thu cọc rồi phát thẻ phòng 301.",2,6,1200,"Đúng quy trình. Tên khớp (chỉ khác dấu), phòng sẵn sàng. Luôn xem giấy tờ gốc trước khi phát thẻ."],
    ["Phát thẻ phòng 201 ngay cho nhanh, khách đã có đặt phòng rồi.",0,2,0,"Bỏ qua bước xác minh danh tính. Nếu người đến không phải người đặt, khách sạn chịu rủi ro pháp lý và an ninh."],
    ["Yêu cầu khách xuất trình thêm sổ hộ khẩu và thẻ tín dụng.",0,-8,0,"Thủ tục thừa. CCCD là đủ để khai báo lưu trú, hỏi thêm chỉ làm khách khó chịu."]]},
{av:"🎒",name:"Trần Quốc Hưng",shift:"Ca sáng · 09:30",
 say:"Chuyến bay của mình đến sớm. Mình đặt phòng từ ngày mai nhưng muốn vào phòng luôn hôm nay được không?",
 docs:[{t:"CCCD",r:[["Họ tên","TRẦN QUỐC HƯNG"],["Ngày sinh","05/11/1990"]]},{t:"Đặt phòng #AG7710",r:[["Nhận phòng","01/10 (ngày mai)"],["Phòng","Superior Twin"],["Giá","900.000đ/đêm"]]}],
 pms:"Còn 3 phòng Superior Twin trống hôm nay. Nhận phòng sớm tính thêm 50% giá đêm.",
 o:[["Báo rõ còn phòng trống, phí nhận sớm là 450.000đ, khách đồng ý thì thêm đêm 30/09 và nhận phòng.",2,8,450000,"Xử lý tốt. Minh bạch phí, tận dụng phòng trống và tạo thêm doanh thu."],
    ["Từ chối: đặt ngày mai thì ngày mai mới được vào.",1,-12,0,"Đúng quy định nhưng cứng nhắc khi còn phòng trống. Bạn bỏ lỡ cơ hội bán thêm và làm khách bực."],
    ["Cho vào luôn, không tính phí để khách vui.",0,10,0,"Khách vui nhưng khách sạn mất doanh thu và sai lệch báo cáo. Miễn phí cần có sự đồng ý của quản lý."]]},
{av:"🕶️",name:"Người lạ tại quầy",shift:"Ca chiều · 14:05",
 say:"Tôi là bạn của ông Lee Sang-woo, đang ở khách sạn mình. Cho tôi xin số phòng để tôi lên gặp nhé.",
 docs:[{t:"Ghi chú hệ thống",r:[["Khách","Mr. Lee Sang-woo"],["Phòng","806"],["Yêu cầu","Không làm phiền"]]}],
 pms:"Người này chưa xuất trình giấy tờ và không có tên trong danh sách khách.",
 o:[["Không tiết lộ số phòng. Đề nghị gọi điện đến phòng ông Lee, nếu ông đồng ý sẽ xuống đón hoặc báo số phòng.",2,4,0,"Chính xác. Thông tin lưu trú của khách là bảo mật, chỉ khách quyết định ai được biết."],
    ["Đọc số phòng 806 vì người này có vẻ lịch sự và biết tên khách.",0,-25,0,"Vi phạm bảo mật nghiêm trọng. Biết tên khách không chứng minh được quan hệ."],
    ["Từ chối thẳng và im lặng, không hỗ trợ gì thêm.",1,-6,0,"Đúng về bảo mật nhưng thiếu hỗ trợ. Luôn đưa ra phương án thay thế như gọi điện cho khách."]]},
{av:"🛂",name:"Emma Carter",shift:"Ca chiều · 16:20",
 say:"Hello! I have a reservation for three nights under Carter.",
 docs:[{t:"Passport (UK)",r:[["Name","CARTER EMMA JANE"],["Visa","Miễn thị thực 45 ngày"],["Nhập cảnh","28/09/2026"]]},{t:"Booking #BK3308",r:[["Guest","Emma Carter"],["Room","Superior King"],["Nights","3"]]}],
 pms:"Khách nước ngoài: bắt buộc khai báo lưu trú với cơ quan công an trong thời hạn quy định.",
 o:[["Kiểm tra hộ chiếu và dấu nhập cảnh, quét vào hệ thống, khai báo lưu trú rồi làm thủ tục check-in.",2,6,1500,"Đúng. Khai báo lưu trú cho khách nước ngoài là bắt buộc, không được bỏ sót."],
    ["Check-in trước, khai báo lưu trú để cuối tuần làm một lượt.",1,3,1500,"Rủi ro trễ hạn khai báo và bị xử phạt. Nên làm ngay khi nhận phòng."],
    ["Chỉ ghi tên vào sổ, không cần giữ hộ chiếu hay quét thông tin.",0,2,0,"Thiếu dữ liệu để khai báo lưu trú. Đây là lỗi tuân thủ pháp luật."]]},
{av:"📱",name:"Lê Thu Hà",shift:"Ca tối · 19:40",
 say:"Mình đặt Deluxe qua Booking từ tuần trước, sao bạn nói hết phòng vậy?",
 docs:[{t:"Đặt phòng #BK5521",r:[["Phòng","Deluxe Double"],["Số đêm","1"],["Đã thanh toán","Có"]]}],
 pms:"Overbooking: phòng Deluxe hết. Còn 1 phòng Junior Suite trống, chênh giá 800.000đ/đêm. Quản lý cho phép nâng hạng miễn phí khi overbooking.",
 o:[["Xin lỗi khách, giải thích lỗi thuộc về khách sạn và nâng hạng miễn phí lên Junior Suite.",2,14,-800000,"Tốt nhất. Chấp nhận lỗi của mình, đền bù tương xứng và giữ được khách. Chi phí nhỏ hơn nhiều so với mất khách và đánh giá xấu."],
    ["Đề nghị khách chờ ở sảnh đến khi có ai trả phòng.",0,-20,0,"Khách đã thanh toán và có xác nhận, bắt chờ không rõ thời gian là không chấp nhận được."],
    ["Bán Junior Suite cho khách với giá chênh 800.000đ.",0,-15,800000,"Bắt khách trả thêm cho lỗi của khách sạn sẽ dẫn đến khiếu nại và đánh giá 1 sao."]]},
{av:"😴",name:"Phạm Đức Thịnh",shift:"Ca đêm · 23:50",
 say:"Phòng bên cạnh mở nhạc ồn từ 10 giờ. Mình đi công tác, mai có họp sớm, bạn xử lý giúp mình!",
 docs:[{t:"Phòng 518",r:[["Khách","Phạm Đức Thịnh"],["Phòng ồn","520"]]}],
 pms:"Bảo vệ đang ở tầng 1. Còn phòng 301 cùng hạng, yên tĩnh. Có thể tặng voucher ăn sáng.",
 o:[["Xin lỗi, báo bảo vệ lên nhắc phòng 520 ngay, đồng thời đề nghị đổi sang phòng 622 và tặng bữa sáng.",2,15,-100000,"Xử lý trọn vẹn: giải quyết nguồn gốc vấn đề, đưa phương án cho khách chọn và đền bù nhỏ."],
    ["Xin lỗi và hứa sẽ nhắc nhở, không làm gì thêm.",1,3,0,"Có thiện chí nhưng thiếu hành động cụ thể. Nên gọi bảo vệ ngay và hỏi khách có muốn đổi phòng."],
    ["Giải thích rằng khách sạn không thể kiểm soát việc khách khác làm.",0,-18,0,"Đổ lỗi và từ chối trách nhiệm. Khách sạn có nghĩa vụ đảm bảo sự yên tĩnh cho khách."]]}
];
const S={trust:50,stress:20,day:1,warn:0,i:0,sat:50,rev:0,ok:0,tot:0,log:[],t:null,late:false};
const $=id=>document.getElementById(id);
const fmt=n=>(n<0?"-":"")+Math.abs(n).toLocaleString("vi-VN")+"đ";
function hud(){S.sat=Math.max(0,Math.min(100,S.sat));$("sTr").textContent=S.trust;$("sSt").textContent=S.stress;$("sSt").style.color=S.stress>=70?"#ffb4a6":"";$("sSat").textContent=Math.max(0,Math.min(100,S.sat));$("sRev").textContent=S.rev.toLocaleString("vi-VN");$("sAcc").textContent=S.tot?Math.round(S.ok/S.tot*100)+"%":"100%"}
function intro(){
 $("stage").innerHTML=`<div class="card center"><h2>FRONTDESK VN</h2><p>Bạn là nhân viên lễ tân của Grand Lotus Hotel. Mỗi khách đến quầy là một tình huống: xác minh giấy tờ, giữ bảo mật, xử lý khiếu nại. Chọn cách xử lý phù hợp nhất.</p><p class="note">Bản demo gồm 11 tình huống: nhận phòng, xếp phòng theo sơ đồ, trả phòng kiểm hóa đơn và night audit. Toàn bộ khách sạn, nhân vật và doanh nghiệp là giả định.</p><button class="btn" id="go">Bắt đầu ca làm</button></div>`;
 $("go").onclick=()=>show();
}
function show(){
 const g=G[S.i];S.late=false;clearInterval(S.t);
 $("shift").textContent=g.shift+" · Lượt "+(S.i+1)+"/"+G.length;
 $("stage").innerHTML=`<div class="card"><div class="patience" role="progressbar" aria-label="Độ kiên nhẫn của khách"><i id="pat"></i></div>
 <div class="guest"><div class="avatar" aria-hidden="true">${g.av}</div><div><div class="name">${g.name}</div><p class="say">${g.say}</p></div></div>
 <div class="docs">${g.docs.map(d=>`<div class="doc"><h3>${d.t}</h3>${d.r.map(r=>`<div><span>${r[0]}</span><span>${r[1]}</span></div>`).join("")}</div>`).join("")}</div>
 <p class="pms"><b>Hệ thống PMS:</b> ${g.pms}</p>
 <div class="opts" id="opts">${g.o.map((o,k)=>`<button class="opt" data-k="${k}">${o[0]}</button>`).join("")}</div><div id="fbk"></div></div>`;
 document.querySelectorAll(".opt").forEach(b=>b.onclick=()=>pick(+b.dataset.k));
 let p=100;const bar=$("pat");
 S.t=setInterval(()=>{p-=(0.55+S.day*0.02)*(S.pm||1)*(S.stress>=70?1.25:1);bar.style.width=p+"%";bar.style.background=p<30?"var(--warn)":p<60?"var(--brass)":"var(--good)";
  if(p<=0){clearInterval(S.t);S.late=true;S.sat-=8;hud()}},250);
}
function pick(k){
 clearInterval(S.t);const g=G[S.i],o=g.o[k];
 let ds=o[2]-(S.late?8:0);
 S.sat+=o[2];S.rev+=o[3];S.tot++;if(o[1]==2)S.ok++;else if(o[1]==1)S.ok+=.5;
 S.log.push({n:g.name,q:o[1]});fx(o[1],S.late);
 document.querySelectorAll(".opt").forEach((b,j)=>{b.disabled=true;if(j==k)b.classList.add("picked")});
 const lab=["Chưa đúng","Chấp nhận được","Xử lý tốt"][o[1]];
 const last=S.i==G.length-1;
 $("fbk").innerHTML=`<div class="fb q${o[1]}"><b>${lab}</b>${o[4]}<div class="delta">Hài lòng ${o[2]>=0?"+":""}${o[2]}${S.late?" (thêm -8 vì để khách chờ lâu)":""} · Doanh thu ${o[3]>=0?"+":""}${fmt(o[3])}</div></div><button class="btn" id="nx">${last?"Xem báo cáo cuối ngày":"Khách tiếp theo"}</button>`;
 $("nx").focus();
 $("nx").onclick=()=>{S.i++;last?end():show()};
}
function end(){
 $("shift").textContent="Báo cáo cuối ngày";
 const acc=S.ok/S.tot,score=Math.max(0,Math.min(100,S.sat))*0.5+acc*100*0.5;
 const st=score>=85?5:score>=70?4:score>=55?3:score>=40?2:1;
 const q=["Cần luyện thêm","Chấp nhận được","Xử lý tốt"];
 $("stage").innerHTML=`<div class="card center"><h2>Kết thúc ca làm</h2><div class="stars" aria-label="${st} trên 5 sao">${"★".repeat(st)}${"☆".repeat(5-st)}</div>
 <p>Hài lòng <b>${Math.max(0,Math.min(100,S.sat))}/100</b> · Doanh thu <b>${fmt(S.rev)}</b> · Chính xác <b>${Math.round(acc*100)}%</b></p>
 <ul class="rev">${S.log.map(l=>`<li>${l.n}: ${q[l.q]}</li>`).join("")}</ul>
 <button class="btn" id="re">Chơi lại</button><p class="note">Bản đầy đủ có thể mở rộng lên 30 ngày, thêm đoàn tour, sự kiện ngẫu nhiên và nâng cấp kỹ năng.</p></div>`;
 $("re").onclick=()=>{Object.assign(S,{i:0,sat:50,rev:0,ok:0,tot:0,log:[]});hud();$("shift").textContent="Khách sạn 5 sao giả định · Quầy lễ tân";intro()};
}

const rooms=[];
for(let f=1;f<=6;f++)for(let k=1;k<=4;k++)rooms.push({n:f+"0"+k,t:f<=2?"Superior":f<=5?"Deluxe":"Suite",f,st:"free",v:f>=5?1:0});
const LB={free:"Trống",occ:"Có khách",clean:"Đang dọn",maint:"Bảo trì"};
function fx(q,late){S.trust=Math.max(0,Math.min(100,S.trust+[-4,0,2][q]));S.stress=Math.max(0,Math.min(100,S.stress+[5,2,-1][q]+(late?3:0)));hud()}
function prog(){const g=G[S.i];if(!g){$("prog").innerHTML="";return}const ca=g.shift.split(" · ")[1],ix=G.map(x=>x.shift.split(" · ")[1]),a=ix.indexOf(ca),n=ix.lastIndexOf(ca)-a+1;

bfast:KT("Hướng dẫn khách đến nhà hàng ăn sáng","Khách xuống sảnh hỏi chỗ ăn sáng.",["Chào khách, hỏi số phòng và gói ăn sáng",1],["Chỉ đường hoặc dẫn khách tới nhà hàng",1],["Báo nhà hàng yêu cầu đặc biệt (dị ứng, ăn chay)",1],["Cho khách vào ăn mà không kiểm tra gói ăn sáng",0]),
arrlist:KT("Chuẩn bị Arrival List","Chuẩn bị danh sách khách đến hôm nay.",["Lấy danh sách khách đến từ hệ thống",1],["Đánh dấu VIP, khách quay lại và yêu cầu đặc biệt",1],["Kiểm tra phòng dự kiến với buồng phòng",1],["In và để sẵn cho ca chiều",1],["Chỉ in tên khách, bỏ ghi chú",0]),
handM:KT("Bàn giao Brief cho ca chiều","Sắp hết ca sáng.",["Bàn giao Arrival List",1],["Bàn giao Invoice",1],["Ghi Log ca sáng đầy đủ",1],["Bàn giao Cash Float đã đếm",1],["Rời quầy ngay khi hết giờ, chưa bàn giao",0]),
brief_a:KT("Nhận Brief từ ca sáng","Ca sáng bàn giao lại quầy cho bạn.",["Nhận Arrival List và kiểm tra",1],["Kiểm tra Invoice",1],["Đọc Log ca sáng",1],["Đếm Cash Float cùng ca sáng rồi ký nhận",1],["Nhận miệng qua lời nhắn, không ký",0]),
welcome:KT("Chuẩn bị Welcome drink","Chuẩn bị đồ uống chào mừng cho khách đến.",["Kiểm tra số lượng theo Arrival List",1],["Chuẩn bị thêm loại không cồn cho trẻ em và khách kiêng",1],["Giữ lạnh và đặt sẵn tại quầy",1],["Chuẩn bị một loại cho tất cả khách",0]),
arrroom:KT("Check Arrival room và Special Request","Kiểm tra phòng khách sắp đến.",["Hỏi buồng phòng phòng đã sẵn sàng",1],["Đối chiếu yêu cầu đặc biệt (giường phụ, tầng cao, dị ứng)",1],["Báo bộ phận liên quan chuẩn bị yêu cầu",1],["Giao phòng chưa kiểm tra để kịp giờ",0]),
vip:KT("Set up VIP","Có khách VIP đến chiều nay.",["Kiểm tra lại phòng VIP đã dọn xong",1],["Đặt hoa, trái cây và thư chào",1],["Chuẩn bị sẵn thủ tục để check-in nhanh",1],["Bỏ qua kiểm tra vì phòng đã dọn sáng nay",0]),
handA:KT("Bàn giao Brief cho ca Đêm","Sắp hết ca chiều.",["Bàn giao Arrival còn lại nếu có",1],["Bàn giao Invoice",1],["Ghi Log ca chiều đầy đủ",1],["Bàn giao Cash Float đã đếm",1],["Chỉ nhắn miệng cho ca đêm",0]),
brief_n:KT("Nhận Brief từ ca Chiều","Ca chiều bàn giao lại quầy cho bạn.",["Arrival còn lại nếu có",1],["Invoice",1],["Log ca chiều",1],["Cash Float đếm cùng ca chiều",1],["Nhận két khi chưa đếm tiền",0]),
ota:KT("Claim tiền từ OTA","Đến giờ đối chiếu và claim tiền từ các kênh OTA.",["Đối chiếu booking OTA với folio",1],["Claim các booking trả trước và khách no-show đúng hạn",1],["Lưu chứng từ và mã booking",1],["Claim cả những booking đã hủy",0]),
deplist:KT("Chuẩn bị Departure List, Invoice","Chuẩn bị cho khách trả phòng sáng mai.",["Lấy danh sách khách trả phòng sáng mai",1],["In Invoice theo đặt phòng",1],["Đánh dấu khách cần xe, trả muộn",1],["Để mặc định, không kiểm tra",0]),
bflist:KT("Chuẩn bị Breakfast List","Chuẩn bị danh sách ăn sáng cho nhà hàng.",["Lấy khách có gói ăn sáng",1],["Ghi dị ứng, ăn chay và yêu cầu đặc biệt",1],["Gửi nhà hàng và kiểm tra lại",1],["Gửi toàn bộ khách trong khách sạn",0]),
handN:KT("Bàn giao cho ca sáng hôm sau","Sắp hết ca đêm.",["Bàn giao Departure List",1],["Bàn giao Invoice",1],["Ghi Log ca đêm đầy đủ",1],["Bàn giao Cash Float sau night audit",1],["Để két chưa đối chiếu sau night audit",0])
};
POOL.forEach((g,i)=>g.id=i);
const rnd=a=>a[Math.floor(Math.random()*a.length)];
const LV=d=>d<8?"Ngày thường":d<15?"Cuối tuần đông khách":d<22?"Mùa cao điểm":"Dịp lễ Tết";
function resetRooms(x){
 const p=Math.min(.78,.3+S.day*.014+(x||0));
 rooms.forEach(r=>{const x=Math.random();r.st=x<p?"occ":x<p+.08?"clean":x<p+.12?"maint":"free"});
 [r=>r.t=="Superior",r=>r.t=="Deluxe"&&!r.v,r=>r.t=="Deluxe"&&r.v,r=>r.t=="Suite"].forEach(f=>{const g=rooms.filter(f);if(!g.some(r=>r.st=="free"))rnd(g).st="free"});
 while(rooms.filter(r=>r.st=="free").length<8)rnd(rooms.filter(r=>r.st!="free")).st="free";
}
function save(){try{localStorage.setItem(K,JSON.stringify({trust:S.trust,stress:S.stress,hist:S.hist,lastEv:S.lastEv,day:S.day,sat:S.sat,rev:S.rev,warn:S.warn,ok:S.ok,tot:S.tot}))}catch(e){}}
function load(){try{return JSON.parse(localStorage.getItem(K))}catch(e){return null}}
function wipe(){try{localStorage.removeItem(K)}catch(e){}}
function menu(){
 const sv=load();$("board").innerHTML="";$("prog").innerHTML="";$("shift").textContent="Khách sạn 5 sao giả định · Quầy lễ tân";
 $("stage").innerHTML=`<div class="card center"><h2>FRONTDESK VN</h2><p>Bạn làm lễ tân 30 ngày tại Grand Lotus Hotel &amp; Spa, khách sạn 5 sao với 24 phòng, spa, nhà hàng và dịch vụ quản gia. Tiêu chuẩn 5 sao nghĩa là khách nhanh mất kiên nhẫn hơn. Mỗi ca có quy trình riêng: ca sáng nhận brief, làm folio, hướng dẫn khách ăn sáng, check-out và chuẩn bị Arrival List; ca chiều chuẩn bị welcome drink, kiểm tra phòng, set up VIP và check-in; ca đêm claim tiền OTA, night audit và chuẩn bị Departure List, Invoice, Breakfast List. Cuối mỗi ca đều phải bàn giao brief. Càng về sau khách càng đông, khách càng nóng tính và phòng trống càng ít. Cuối ngày bạn nhận thưởng hoặc bị phạt. Hài lòng dưới 25 hoặc Uy tín dưới 20 vào cuối ngày là một cảnh cáo. Xử lý đúng giúp tăng Uy tín và giảm Stress, sai sót làm Stress tăng và trên 80 thì bạn kiệt sức, đủ 3 cảnh cáo thì mất việc.</p>
 <button class="btn" id="nw" style="margin:14px 6px 0">Chơi mới</button>${sv?`<button class="btn" id="ct" style="margin:14px 6px 0">Tiếp tục ngày ${sv.day}</button>`:""}
 <p class="note">Toàn bộ khách sạn, nhân vật và doanh nghiệp là giả định. Tiến trình được lưu tự động trên trình duyệt này.</p></div>`;
 $("nw").onclick=()=>{Object.assign(S,{trust:50,stress:20,day:1,warn:0,sat:50,rev:0,ok:0,tot:0,hist:[],lastEv:""});hud();startDay()};
 if(sv)$("ct").onclick=()=>{Object.assign(S,sv);hud();startDay()};
}
function startDay(){
 S.hist=S.hist||[];const ban=S.hist.flat();
 S.ev=S.day%3==2?rnd(EVT.filter(e=>e.n!=S.lastEv)):null;if(S.ev)S.lastEv=S.ev.n;
 S.pm=S.ev?S.ev.pm:1;resetRooms(S.ev?S.ev.occ:0);
 const pool=POOL.filter(g=>g.k!="audit"&&!ban.includes(g.id)).sort(()=>Math.random()-.5);
 const take=(f,n)=>{const r=[];for(let i=pool.length-1;i>=0&&r.length<n;i--)if(f(pool[i]))r.push(pool.splice(i,1)[0]);return r};
 const fill=(r,n)=>[...r,...take(g=>!g.k,n-r.length)].sort(()=>Math.random()-.5),tc=(c,n)=>take(g=>g.cat==c,n);
 const gm=fill([...take(g=>g.k=="co",2),...tc("i",2)],6),ga=fill([...take(g=>g.k=="assign",3),...tc("w",2),...tc("i",1)],8),gn=fill([...tc("w",1),...tc("i",2)],6);
 S.hist.push([...gm,...ga,...gn].map(g=>g.id));S.hist=S.hist.slice(-3);
 const pr=g=>{const c={...g};if(c.o)c.o=c.o.slice().sort(()=>Math.random()-.5);if(c.k)c.name=rnd(NAMES);return c};
 const tk=k=>({...TASKS[k],items:TASKS[k].items.slice().sort(()=>Math.random()-.5)});
 const ae=ga.map(pr);
 if(S.ev){const e={...S.ev.s};e.o=e.o.slice().sort(()=>Math.random()-.5);e.name="⚠️ "+e.name;ae.splice(Math.floor(Math.random()*(ae.length+1)),0,e)}
 const a=JSON.parse(JSON.stringify(POOL.find(g=>g.k=="audit"))),d=rnd([150000,300000,500000]);
 const t=x=>x.replace(/8\.150\.000đ|300\.000đ/g,m=>m[0]=="8"?fmt(8450000-d):fmt(d));
 a.say=t(a.say);a.o.forEach(o=>{o[0]=t(o[0]);o[4]=t(o[4])});a.o.sort(()=>Math.random()-.5);a.name="Night Audit - Cut-off";
 const sh=(ca,arr)=>arr.map(g=>({...g,shift:"Ngày "+S.day+" · "+ca}));
 const q=[...sh("Ca sáng",[bf("Nhận brief từ ca đêm","Departure List"),tk("folio"),tk("bfast"),...gm.map(pr),tk("arrlist"),tk("handM")]),
  ...sh("Ca chiều",[bf("Nhận Brief từ ca sáng","Arrival List"),tk("welcome"),tk("arrroom"),tk("vip"),...ae,tk("handA")]),
  ...sh("Ca đêm",[bf("Nhận Brief từ ca Chiều","Arrival còn lại"),...gn.map(pr),tk("ota"),a,tk("deplist"),tk("bflist"),tk("handN")])];
 const nt=q.filter(g=>g.k=="task").length;
 G.length=0;G.push(...q);S.i=0;S.log=[];S.d0={ok:S.ok,tot:S.tot};
 board(0);$("shift").textContent="Ngày "+S.day+"/30";
 $("stage").innerHTML=`<div class="card center"><h2>Ngày ${S.day}: ${LV(S.day)}</h2>${S.ev?`<div class="fb q1" style="text-align:left"><b>${S.ev.ic} Sự kiện đặc biệt: ${S.ev.n}</b>${S.ev.d}</div>`:""}<p>Hôm nay có ${q.length} lượt việc trong 3 ca: ${nt} bước quy trình ca và ${q.length-nt} lượt xử lý khách. Cảnh cáo hiện tại: ${S.warn}/3.</p><button class="btn" id="st">Bắt đầu ca sáng</button></div>`;
 $("st").onclick=show;save();
}
end=function(){
 const h=Math.max(1,S.tot-S.d0.tot),acc=(S.ok-S.d0.ok)/h,score=S.sat*.5+acc*50;
 const st=score>=85?5:score>=70?4:score>=55?3:score>=40?2:1;
 const bonus=st>=4?500000*(st-3):st<=2?-300000:0;S.rev+=0;S.rev+=bonus;
 const low=S.sat<25||S.trust<=20;if(low)S.warn++;
 const lost=S.warn>=3,win=!lost&&S.day>=30,bad=S.log.filter(l=>l.q<2).map(l=>l.n);
 hud();$("shift").textContent="Báo cáo ngày "+S.day+"/30";
 const fin=lost||win;if(fin)wipe();
 $("stage").innerHTML=`<div class="card center"><h2>${lost?"Bạn bị cho thôi việc":win?"Hoàn thành 30 ngày!":"Kết thúc ngày "+S.day}</h2><div class="stars" aria-label="${st} trên 5 sao">${"★".repeat(st)}${"☆".repeat(5-st)}</div>
 <p>Xử lý <b>${h}</b> lượt · Chính xác ngày này <b>${Math.round(acc*100)}%</b> · Hài lòng <b>${S.sat}/100</b><br>${bonus?(bonus>0?"Thưởng ":"Phạt ")+fmt(Math.abs(bonus))+" · ":""}Tổng doanh thu <b>${fmt(S.rev)}</b></p>
 <p>Uy tín với quản lý <b>${S.trust}/100</b> · Stress <b>${S.stress}/100</b>${S.stress>=80?" (kiệt sức: hài lòng bị trừ 8 sang ngày sau)":""}</p>${bad.length?`<p>Cần xem lại: ${bad.join(", ")}.</p>`:"<p>Không có lỗi nào hôm nay.</p>"}
 ${low?`<p><b>Cảnh cáo ${S.warn}/3:</b> hài lòng dưới 25 hoặc uy tín quá thấp.</p>`:""}
 ${lost?"<p>Ba lần cảnh cáo. Khách sạn tìm người thay bạn.</p>":win?`<p>Kết quả cuối: doanh thu ${fmt(S.rev)}, chính xác ${Math.round(S.ok/S.tot*100)}%, ${S.warn} cảnh cáo.</p>`:""}
 <button class="btn" id="nd">${fin?"Về menu":"Sang ngày "+(S.day+1)}</button></div>`;
 $("nd").onclick=()=>{if(fin){menu();return}S.sat=Math.min(100,S.sat+8-(S.stress>=80?16:0));S.stress=Math.max(0,S.stress-(S.stress>=80?15:30));S.day++;hud();startDay()};
};
hud();menu();
</script>
